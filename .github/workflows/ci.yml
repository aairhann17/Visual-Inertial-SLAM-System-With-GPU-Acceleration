name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  cpp-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ libopencv-dev pkg-config

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVISLAM_ENABLE_CUDA=OFF -DVISLAM_BUILD_TESTS=ON -DVISLAM_ENABLE_STRICT_WARNINGS=ON

      - name: Build
        run: cmake --build build --config Release -j$(nproc)

      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure

  api-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vislam
          POSTGRES_PASSWORD: vislam
          POSTGRES_DB: vislam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vislam -d vislam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://vislam:vislam@localhost:5432/vislam
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/api/package-lock.json

      - name: Install API dependencies
        working-directory: services/api
        run: npm ci

      - name: Initialize schema
        working-directory: services/api
        run: npm run db:init

      - name: Static syntax checks
        working-directory: services/api
        run: |
          node --check src/server.js
          node --check src/services/runManager.js
          node --check src/services/runRepository.js

  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build web app
        working-directory: apps/web
        run: npm run build

